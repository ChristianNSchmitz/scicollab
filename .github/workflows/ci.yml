name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      # Builds in demo mode (no Supabase credentials), which renders every
      # route against the seeded store, so a page that cannot compile or
      # prerender fails here rather than on deploy.
      - name: Build
        run: npm run build
