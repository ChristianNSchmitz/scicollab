document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a7068ca7-0753-4f8b-87d4-985145ea1e6b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0f84b05c-6989-4fea-a6f9-6ff2a108549e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6320a1d5-5103-4b8e-93cc-9237c004fa99\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"ded8d0c6-8263-4c11-a655-1bcf55ff0a22\"><\u002Fscript>\n<script src=\"d4703a98-27ff-4f71-aba0-8e78fa8d4a49\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d7e9f12e-5c6f-4ec9-a898-55df9feeaec1\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e13332c3-a831-477a-92b4-0b73db127be9\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+ e {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"accd2eaa-dac3-4915-a794-9d2625af6ac1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; font-family:'JetBrains Mono', ui-monospace, monospace; background:#E8E6E1; }\n  a { color:#B33600; text-decoration:none; }\n  a:hover { color:#FF4D00; }\n  ::selection { background:#FF4D00; color:#fff; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--bg:#F7F6F3;--surface:#FFFFFF;--ink:#0D0D0D;--mute:#6B6B6B;--rule:#D6D3CD;--signal:#FF4D00;--flag:#FFD400;--ok:#0B7A4B;--err:#B3261E;--info:#1B4FA0;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif;background:#E8E6E1;color:var(--ink);padding:40px 40px 88px;font-family:var(--mono);display:flex;flex-direction:column;gap:36px;width:max-content\">\n\n  <div style=\"max-width:1440px\">\n    <div style=\"font:400 11px/1 var(--mono);color:var(--signal);letter-spacing:.16em;margin-bottom:14px\">EVALUATION LAYER · BOARD 3 OF 6<\u002Fdiv>\n    <h1 style=\"font:700 28px/1.2 var(--mono);margin:0 0 8px;letter-spacing:-.03em\">Heuristic review · ten screens<\u002Fh1>\n    <p style=\"font:400 14px/1.5 var(--sans);color:#4A4A4A;margin:0 0 12px;max-width:88ch\">The ten most complex screens against Nielsen's ten heuristics. <b>{{ total }} findings<\u002Fb> — {{ nCat }} catastrophic, {{ nMaj }} major, {{ nMin }} minor, {{ nCos }} cosmetic. Each names the screen and the element. A review that found nothing would mean it was not performed.<\u002Fp>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <a href=\"SciCollab Foundation.dc.html\" style=\"font:500 11px/1 var(--mono);border:1px solid var(--ink);padding:7px 10px;color:var(--ink)\">← foundation<\u002Fa>\n      <a href=\"SciCollab K2 - Usability.dc.html\" style=\"font:500 11px/1 var(--mono);border:1px solid var(--ink);padding:7px 10px;color:var(--ink)\">← K2 usability<\u002Fa>\n      <a href=\"SciCollab K4 - Consistency.dc.html\" style=\"font:500 11px/1 var(--mono);border:1px solid var(--ink);padding:7px 10px;color:var(--ink)\">K4 consistency →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:1440px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--ink)\">\n    <div style=\"background:#FCF3F2;padding:16px\"><div style=\"font:700 28px/1 var(--mono);color:var(--err)\">{{ nCat }}<\u002Fdiv><div style=\"font:500 10px/1.3 var(--mono);color:var(--err);margin-top:7px\">CATASTROPHIC<\u002Fdiv><div style=\"font:400 11px/1.4 var(--sans);color:var(--mute);margin-top:7px\">Blocks the task or causes irreversible loss. Fix before any user test.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#FFFCEF;padding:16px\"><div style=\"font:700 28px/1 var(--mono);color:#6B5900\">{{ nMaj }}<\u002Fdiv><div style=\"font:500 10px/1.3 var(--mono);color:#6B5900;margin-top:7px\">MAJOR<\u002Fdiv><div style=\"font:400 11px/1.4 var(--sans);color:var(--mute);margin-top:7px\">Users will fail or take a costly wrong path. Fix before the pilot.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:16px\"><div style=\"font:700 28px/1 var(--mono)\">{{ nMin }}<\u002Fdiv><div style=\"font:500 10px/1.3 var(--mono);color:var(--mute);margin-top:7px\">MINOR<\u002Fdiv><div style=\"font:400 11px/1.4 var(--sans);color:var(--mute);margin-top:7px\">Slows people down or annoys. Fix when the screen is next touched.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--surface);padding:16px\"><div style=\"font:700 28px/1 var(--mono);color:var(--mute)\">{{ nCos }}<\u002Fdiv><div style=\"font:500 10px/1.3 var(--mono);color:var(--mute);margin-top:7px\">COSMETIC<\u002Fdiv><div style=\"font:400 11px/1.4 var(--sans);color:var(--mute);margin-top:7px\">Noted, not scheduled. Fix if convenient.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:1440px;border:1px solid var(--err);background:#FCF3F2;padding:18px 20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--err);padding-bottom:10px;margin-bottom:14px\">\n      <span style=\"font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--err)\">THE TWO CATASTROPHIC FINDINGS<\u002Fspan>\n      <span style=\"font:400 11px/1 var(--mono);color:var(--mute);margin-left:auto\">both are error-prevention failures, both are one-way doors<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px\">\n      <div style=\"border:1px solid var(--err);background:var(--surface);padding:15px\">\n        <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:10px\"><span style=\"font:500 10px/1 var(--mono);color:var(--err);letter-spacing:.06em\">H5 · ERROR PREVENTION<\u002Fspan><span style=\"margin-left:auto;font:400 10px/1 var(--mono);color:var(--mute)\">E1 deposit · step 4 licence picker<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 13px/1.35 var(--mono);margin-bottom:9px\">A licence choice is permanent and the screen does not say so<\u002Fdiv>\n        <div style=\"font:400 13px/1.55 var(--sans);margin-bottom:11px\">Once a dataset is public under CC-BY, that grant cannot be withdrawn from anyone who already has the data. The licence select on <a href=\"SciCollab E1 - Deposit Flow.dc.html#s4\">deposit step 4<\u002Fa> looks and behaves exactly like the format select two fields above it — same control, same weight, no confirmation, no statement of irreversibility. The <a href=\"SciCollab I3 - Confidential and Audit.dc.html#s2\">patent gate<\u002Fa> gets a full modal with type-to-confirm; a licence grant is the same class of one-way door and gets a dropdown.<\u002Fdiv>\n        <div style=\"border-top:1px solid var(--rule);padding-top:10px;font:400 12px/1.5 var(--sans);color:var(--mute)\"><b style=\"color:#0D0D0D\">Fix:<\u002Fb> a one-line irreversibility statement under the control, and a confirmation step when the choice is more permissive than the project default. Not a modal — the patent gate earns one because it is once per project; this fires on every deposit.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--err);background:var(--surface);padding:15px\">\n        <div style=\"display:flex;align-items:baseline;gap:9px;margin-bottom:10px\"><span style=\"font:500 10px/1 var(--mono);color:var(--err);letter-spacing:.06em\">H1 · VISIBILITY OF SYSTEM STATUS<\u002Fspan><span style=\"margin-left:auto;font:400 10px/1 var(--mono);color:var(--mute)\">D1 ELN · entry view<\u002Fspan><\u002Fdiv>\n        <div style=\"font:500 13px/1.35 var(--mono);margin-bottom:9px\">Append-only is stated in words but never shown while typing<\u002Fdiv>\n        <div style=\"font:400 13px/1.55 var(--sans);margin-bottom:11px\">The <a href=\"SciCollab D1 - Projects and ELN.dc.html#s5\">notebook entry<\u002Fa> explains the append-only constraint in a panel, but the composing area gives no persistent signal that what is typed becomes immutable on save. A researcher who assumes normal draft-and-edit behaviour will commit a half-finished entry, and in a countersigned regulated notebook that entry cannot be removed — only superseded, visibly, forever.<\u002Fdiv>\n        <div style=\"border-top:1px solid var(--rule);padding-top:10px;font:400 12px/1.5 var(--sans);color:var(--mute)\"><b style=\"color:#0D0D0D\">Fix:<\u002Fb> a permanent chrome state on the editor itself — a left rule and a label reading <span style=\"font-family:var(--mono);font-size:11px\">APPEND-ONLY · SAVE IS FINAL<\u002Fspan> — plus an explicit draft mode that is visibly <i>not<\u002Fi> the notebook until committed.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ screens }}\" as=\"s\" hint-placeholder-count=\"10\">\n    <div style=\"position:relative;width:1440px;border:1px solid var(--ink);background:var(--surface)\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--bg)\">\n        <span style=\"width:24px;height:24px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 11px/1 var(--mono);flex:none\">{{ s.n }}<\u002Fspan>\n        <a href=\"{{ s.href }}\" style=\"font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink)\">{{ s.name }}<\u002Fa>\n        <span style=\"font:400 10px/1 var(--mono);color:var(--mute)\">{{ s.why }}<\u002Fspan>\n        <span style=\"margin-left:auto;font:400 10px/1 var(--mono);color:var(--mute)\">{{ s.count }}<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <sc-for list=\"{{ s.findings }}\" as=\"x\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:104px 176px minmax(0,1fr);border-bottom:1px solid #EBE8E2;align-items:start\">\n            <div style=\"padding:11px 12px\"><span ref=\"{{ x.ref }}\" style=\"display:inline-flex;padding:3px 8px;border:1px solid var(--rule);font:500 9px/1.3 var(--mono);letter-spacing:.06em\">{{ x.sev }}<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:11px 8px;font:400 10px/1.45 var(--mono);color:var(--mute)\">{{ x.heuristic }}<\u002Fdiv>\n            <div style=\"padding:11px 12px\"><span style=\"font:500 12px/1.45 var(--mono)\">{{ x.el }}<\u002Fspan> <span style=\"font:400 13px/1.5 var(--sans)\">— {{ x.text }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div style=\"width:1440px;border:1px solid var(--ink);background:#0D0D0D;color:#F2F0EC;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:26px\">\n    <div>\n      <div style=\"font:500 10px/1 var(--mono);letter-spacing:.1em;color:#FF5A14;margin-bottom:11px\">THE PATTERN ACROSS ALL {{ total }} FINDINGS<\u002Fdiv>\n      <div style=\"font:400 13px/1.6 var(--sans);color:#B6B2AC;margin-bottom:13px\">The largest cluster is <b style=\"color:#F2F0EC\">{{ topH }}<\u002Fb> with <b style=\"color:#F2F0EC\">{{ topN }}<\u002Fb> findings — nearly twice the next heuristic. The product repeatedly <i>shows a state without saying what it means<\u002Fi>: a spinner with no scope, a v6 badge that does not say \"current\", 94% with no breakdown, a hash chain with no verification timestamp.<\u002Fdiv>\n      <div style=\"font:400 13px/1.6 var(--sans);color:#B6B2AC\">That is a different and more useful finding than the one this block previously asserted. It is also cheap to fix: almost every H1 finding is a missing label next to a number that is already on screen.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:500 10px/1 var(--mono);letter-spacing:.1em;color:#FF5A14;margin-bottom:11px\">FINDINGS PER HEURISTIC · ALL {{ total }}<\u002Fdiv>\n      <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"10\">\n        <div style=\"display:grid;grid-template-columns:34px 1fr 22px;gap:9px;align-items:center;margin-bottom:6px\">\n          <span style=\"font:500 10px/1 var(--mono);color:#8E8B85\">{{ b.k }}<\u002Fspan>\n          <span style=\"display:block;height:8px;background:#2E2C29\"><span ref=\"{{ b.ref }}\" style=\"display:block;height:100%;background:#8E8B85\"><\u002Fspan><\u002Fspan>\n          <span style=\"font:400 10px/1 var(--mono);color:#B6B2AC;text-align:right\">{{ b.n }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font:400 11px/1.5 var(--sans);color:#8E8B85;margin-top:11px;padding-top:10px;border-top:1px solid #2E2C29\">Lowest is <b style=\"color:#F2F0EC\">{{ lowH }}<\u002Fb> at {{ lowN }}. <b style=\"color:#F2F0EC\">H10 help<\u002Fb> is genuinely strong — the product explains its own reasoning on almost every screen — but <b style=\"color:#F2F0EC\">H8 minimalism<\u002Fb> at 5 is joint-second, so \"dense but never decorative\" is doing less work than it looks.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:500 10px/1 var(--mono);letter-spacing:.1em;color:#FF5A14;margin-bottom:11px\">WHAT THIS REVIEW CANNOT TELL YOU<\u002Fdiv>\n      <div style=\"font:400 12px/1.55 var(--sans);color:#B6B2AC\">Whether a researcher will fill in seven fields when a text box would do. No heuristic catches that — only the five testers can. It is the single largest risk in the product and it is not on this board.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst S = [\n {n:'1', name:'C1 · QUESTION COMPOSER', href:'SciCollab C1 - Ask and Compose.dc.html#s1', why:'7 fields, live retrieval, 3 panels', findings:[\n  {sev:'MAJOR', heuristic:'H6 · recognition not recall', el:'Conditions block', text:'\"4 of 6 filled\" tells you a count but not which two are missing until you read every row. The two empty fields are yellow, but the counter should name them.'},\n  {sev:'MAJOR', heuristic:'H2 · match to the real world', el:'\"Signal\" as the vote label', text:'Researchers know upvotes. \"Signal\" is our word, defined nowhere on this screen, and it sits next to a number people will read as karma.'},\n  {sev:'MINOR', heuristic:'H1 · visibility of status', el:'Retrieval spinner', text:'The right panel spins with no indication of what it is searching or how long it takes. A first-time user cannot tell whether it is working or stuck.'},\n  {sev:'MINOR', heuristic:'H3 · user control', el:'DOI auto-expansion', text:'A pasted DOI silently expands into a citation card. Correct behaviour, but it happens without announcement and there is no visible undo.'},\n  {sev:'COSMETIC', heuristic:'H8 · minimalism', el:'Toolbar', text:'Seven format buttons compete with the seven content fields. TeX, code and molecule could live behind one \"insert\" affordance.'}]},\n\n {n:'2', name:'E1 · DEPOSIT FLOW, STEP 3 METADATA', href:'SciCollab E1 - Deposit Flow.dc.html#s3', why:'the screen testers named as worst', findings:[\n  {sev:'MAJOR', heuristic:'H1 · visibility of status', el:'FAIR score meter', text:'The score rises as fields are completed but never states the target. Is 0.7 good? A number with no scale is decoration, and this one is doing real persuasive work.'},\n  {sev:'MAJOR', heuristic:'H7 · flexibility', el:'Discipline template', text:'No way to save a filled template as a personal default. A researcher depositing weekly re-types the same instrument and cell line every time — the exact friction this batch existed to remove.'},\n  {sev:'MINOR', heuristic:'H5 · error prevention', el:'Required-field marks', text:'Required and recommended fields are distinguished only by a small label. At a glance the form looks longer than it is mandatory.'},\n  {sev:'MINOR', heuristic:'H9 · recover from errors', el:'Upload continues behind the form', text:'If the form is abandoned, what happens to the 2 GB already uploaded is not stated anywhere on screen.'},\n  {sev:'COSMETIC', heuristic:'H4 · consistency', el:'Field order', text:'Instrument comes before organism here and after it on the composer. Trivial, but it is the same metadata.'}]},\n\n {n:'3', name:'C2 · METHOD CARD, FULL VIEW', href:'SciCollab C2 - Method Cards.dc.html#s1', why:'9 steps, 3 failure modes, lineage, discussion', findings:[\n  {sev:'MAJOR', heuristic:'H6 · recognition not recall', el:'\"Fork\" vs \"Record a run\"', text:'Two primary-weight actions whose difference is the entire mental model of the object, explained nowhere on the card. A newcomer cannot tell which one they want.'},\n  {sev:'MINOR', heuristic:'H1 · visibility of status', el:'v6 badge', text:'Nothing indicates whether you are reading the current version or an old one until you open the version selector. The badge says v6; it does not say \"current\".'},\n  {sev:'MINOR', heuristic:'H8 · minimalism', el:'Steps section', text:'Showing 5 of 9 steps with \"show all\" saves space but breaks the one thing a protocol reader wants: to read the protocol.'},\n  {sev:'COSMETIC', heuristic:'H2 · match to the real world', el:'\"Reproductions: 8, failed: 2\"', text:'Reads as though the card failed twice. It means two labs ran it and got a different result, which is a different claim.'}]},\n\n {n:'4', name:'I1 · ADMIN CONSOLE HOME', href:'SciCollab I1 - Console and Identity.dc.html#s1', why:'12 nav items, 4 stat cards, policy table', findings:[\n  {sev:'MAJOR', heuristic:'H5 · error prevention', el:'Policy defaults table', text:'The table displays policy values but gives no indication that changing one applies retroactively or only to new artifacts. That distinction is the difference between a safe edit and an incident.'},\n  {sev:'MINOR', heuristic:'H3 · user control', el:'Left rail, 12 items', text:'No grouping beyond one divider. Governance, reporting and compliance items interleave, so finding \"audit log\" requires reading all twelve.'},\n  {sev:'MINOR', heuristic:'H1 · visibility of status', el:'\"NEEDS YOU · 3\"', text:'Three urgent items in a yellow box with no indication of which is most urgent. The erasure request at day 19 of 30 is materially different from an ethics expiry 41 days out.'},\n  {sev:'COSMETIC', heuristic:'H8 · minimalism', el:'Seats card', text:'\"14 dormant 90 d\" is presented without a suggested action, so it reads as an accusation rather than information.'}]},\n\n {n:'5', name:'H5 · AI ASSISTANT PANEL', href:'SciCollab H5 - AI.dc.html#s1', why:'4 claims, 6 sources, confidence model', findings:[\n  {sev:'MAJOR', heuristic:'H2 · match to the real world', el:'Confidence: MODERATE', text:'Users will read this as the model\\'s certainty about its answer. It actually means \"multiple sources, none replicated\" — a claim about the evidence, not the AI. The distinction is stated in the sidebar and will be missed.'},\n  {sev:'MINOR', heuristic:'H6 · recognition not recall', el:'Claim-to-source mapping', text:'Sources list \"claims 1, 2\" but the claims are numbered in a different column. Following claim 3 to its source requires holding a number in your head across the screen.'},\n  {sev:'MINOR', heuristic:'H10 · help', el:'\"What I did not find\"', text:'Excellent, and buried below the fold under four claims. For a researcher assessing whether to trust this, it is the most important block on the screen.'},\n  {sev:'COSMETIC', heuristic:'H4 · consistency', el:'Source chips', text:'Chips here use a two-part label (type + id); the retrieval panel in C1 uses type on a separate line. Same object, two treatments.'}]},\n\n {n:'6', name:'D2 · AUDIT TRAIL', href:'SciCollab D2 - Governance.dc.html#s1', why:'auditor-facing, 1.4M events', findings:[\n  {sev:'MAJOR', heuristic:'H7 · flexibility and efficiency', el:'Saved questions', text:'Good for the five questions provided; there is no way for an auditor to save their own. An auditor with a sixth question has to construct it every time.'},\n  {sev:'MINOR', heuristic:'H1 · visibility of status', el:'Hash-chain indicator', text:'The chain is stated as verified but there is no timestamp for when verification last ran. For an auditor that is the whole question.'},\n  {sev:'MINOR', heuristic:'H9 · recover from errors', el:'Filtered empty state', text:'A filter combination returning nothing is ambiguous: no events, or a malformed filter? The screen does not distinguish them.'},\n  {sev:'COSMETIC', heuristic:'H2 · match to the real world', el:'Event names', text:'\"visibility change · lab → public\" is clear; \"policy change · AI training → disabled\" reads like a log line rather than a sentence.'}]},\n\n {n:'7', name:'F3 · RIGHTS CHECK', href:'SciCollab F3 - Rights and Publishing.dc.html#s1', why:'legally load-bearing, 3 outcome states', findings:[\n  {sev:'MAJOR', heuristic:'H1 · visibility of status', el:'Amber \"private only\" state', text:'The three outcomes are distinguished by colour and a label, but the amber state does not state the consequence of ignoring it. The ACS and Elsevier settlement is annotated as context, not as a warning to the person about to click.'},\n  {sev:'MINOR', heuristic:'H10 · help', el:'Policy source', text:'The publisher policy is quoted but not dated or linked to its source. Policies change; a researcher relying on this needs to know when we last checked.'},\n  {sev:'COSMETIC', heuristic:'H6 · recognition', el:'Version terminology', text:'\"Accepted manuscript\" and \"version of record\" are correct publishing terms that a first-year PhD student will not know, and they are not explained here.'}]},\n\n {n:'8', name:'D5 · DEPARTURE HANDOVER PACK', href:'SciCollab D5 - Continuity.dc.html#s1', why:'the differentiating institutional screen', findings:[\n  {sev:'MAJOR', heuristic:'H3 · user control and freedom', el:'The six blanks', text:'The leaver is asked six questions with no way to say \"I do not know\" or \"ask X instead\". Someone in their final week will abandon rather than answer badly, and an abandoned pack is worse than a partial one.'},\n  {sev:'MINOR', heuristic:'H1 · visibility of status', el:'94% compiled', text:'The percentage is compelling but does not say what the missing 6% is until you scroll. Lead with the six items, not the number.'},\n  {sev:'COSMETIC', heuristic:'H8 · minimalism', el:'Interview questions', text:'Six generated questions is generous; three well-chosen ones would be answered.'}]},\n\n {n:'9', name:'H1 · HOME FEED', href:'SciCollab H1 - Feed.dc.html#s1', why:'7 card variants, ranking controls', findings:[\n  {sev:'MINOR', heuristic:'H6 · recognition not recall', el:'\"Why am I seeing this?\"', text:'Present on every card as small grey text at the top right — the lowest-salience position on the card, for the control that answers the product\\'s most important promise.'},\n  {sev:'MINOR', heuristic:'H4 · consistency', el:'Card action rows', text:'The negative-result card ends with a stat strip, the method-card variant with two buttons, the figure card with tag chips. Three different closing patterns in one scroll.'},\n  {sev:'MINOR', heuristic:'H7 · flexibility', el:'Chronological toggle', text:'Switching is one click, but there is no way to set chronological as the permanent default from the feed itself.'},\n  {sev:'COSMETIC', heuristic:'H1 · visibility', el:'\"You are up to date\"', text:'Excellent pattern, placed in the right sidebar rather than at the end of the feed where the user actually arrives.'}]},\n\n {n:'10', name:'G4 · DIRECT MESSAGES, GATED STATE', href:'SciCollab G4 - Messaging.dc.html#s1', why:'refuses a user action, three exit paths', findings:[\n  {sev:'MINOR', heuristic:'H9 · recover from errors', el:'Three unlock paths', text:'All three are shown as equally weighted progress bars, but ORCID verification takes two minutes and reaching 15 reputation takes days. Only one is labelled \"fastest\".'},\n  {sev:'MINOR', heuristic:'H2 · match to the real world', el:'\"15 reputation on any axis\"', text:'A new account has no idea what 15 represents. Two accepted answers? Twenty? The number is meaningless without a worked example.'},\n  {sev:'COSMETIC', heuristic:'H8 · minimalism', el:'Four alternatives block', text:'Four suggested alternatives below three unlock paths is seven options on a screen whose message is \"not yet\".'}]},\n];\n\nconst SEV = { CATASTROPHIC:['#B3261E','#FCF3F2','#B3261E'], MAJOR:['#6B5900','#FFFCEF','#8A7300'], MINOR:['#0D0D0D','#FFFFFF','#D6D3CD'], COSMETIC:['#6B6B6B','#FFFFFF','#D6D3CD'] };\n\nclass Component extends DCLogic {\n  refs = {};\n  ref(k) { return (this.refs[k] = this.refs[k] || React.createRef()); }\n  componentDidMount() { this.paint(); }\n  componentDidUpdate() { this.paint(); }\n  paint() {\n    const t = this._tally || {};\n    const max = Math.max.apply(null, Object.keys(t).map(k => t[k]).concat([1]));\n    Object.keys(t).forEach(k => {\n      const el = (this.refs['t' + k] || {}).current; if (!el) return;\n      el.style.width = Math.round((t[k] / max) * 100) + '%';\n      el.style.background = t[k] >= max ? '#B3261E' : t[k] >= max * 0.55 ? '#0D0D0D' : '#B8B4AC';\n    });\n    S.forEach((s, si) => s.findings.forEach((f, fi) => {\n      const el = (this.refs[si + '-' + fi] || {}).current; if (!el) return;\n      const c = SEV[f.sev] || SEV.MINOR;\n      el.style.color = c[0]; el.style.background = c[1]; el.style.borderColor = c[2];\n    }));\n  }\n  renderVals() {\n    const all = S.flatMap(s => s.findings);\n    const n = sev => all.filter(f => f.sev === sev).length;\n    const CATASTROPHIC = 2; // the two in the callout block above, not repeated in the tables\n    // per-heuristic tally, including the two catastrophic findings from the callout\n    const tally = {};\n    const bump = h => { const k = (h.match(/H\\d+/) || ['?'])[0]; tally[k] = (tally[k] || 0) + 1; };\n    all.forEach(f => bump(f.heuristic));\n    bump('H5 · error prevention');           // catastrophic 1 · licence picker\n    bump('H1 · visibility of system status'); // catastrophic 2 · append-only ELN\n    this._tally = tally;\n    const ranked = Object.keys(tally).sort((a, b) => tally[b] - tally[a] || a.localeCompare(b));\n    const top = ranked[0], second = ranked[1];\n    return {\n      total: all.length + CATASTROPHIC,\n      topH: top, topN: tally[top],\n      secondH: second, secondN: tally[second],\n      topTwoN: tally[top] + tally[second],\n      lowH: ranked[ranked.length - 1], lowN: tally[ranked[ranked.length - 1]],\n      bars: ranked.map(k => ({ k, n: tally[k], ref: this.ref('t' + k) })),\n      nCat: CATASTROPHIC,\n      nMaj: n('MAJOR'),\n      nMin: n('MINOR'),\n      nCos: n('COSMETIC'),\n      screens: S.map((s, si) => ({\n        ...s,\n        count: s.findings.length + ' findings',\n        findings: s.findings.map((f, fi) => ({ ...f, ref: this.ref(si + '-' + fi) })),\n      })),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
